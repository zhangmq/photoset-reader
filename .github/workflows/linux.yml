name: linux

# ── Linux 构建 + 测试（主平台）──────────────────────────────────────────────
#   ★★ 为什么是 **Arch 容器**而不是 `ubuntu-latest`：
#     项目要求 **Qt ≥ 6.9**（`RectangularShadow` 是 6.9 才有的，见 CMakeLists 的
#     `find_package(Qt6 6.9 ...)`），而 **Ubuntu 24.04 只提供 Qt 6.4** ⇒ 在
#     ubuntu-latest 上 configure 第一步就失败，跑多少次都一样。
#     Arch 官方源里的 Qt 与主平台构建环境同源（2026-11-06 实测 6.12.0），
#     且 **libunrar 是官方包**（Windows 那边没有 port，才必须自编）。
#   ★ 发行版覆盖说明（给用户，不是给 CI）：`scripts/install-deps.sh` 覆盖
#     Arch / Debian·Ubuntu / Fedora / openSUSE，含 libunrar 在各家的出处。
#     本工作流只负责"这棵树能编、能过测试、能力探测正常"，**不是发布渠道**。

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git cmake ninja gcc pkgconf \
            qt6-base qt6-declarative qt6-shadertools qt6-tools qt6-svg qt6-imageformats \
            libarchive libexif xz zlib libunrar \
            gdk-pixbuf2 \
            qt6-wayland
          #   ★ `qt6-wayland`（2026-11-07）：不装它，linuxdeploy 只把 **xcb** 平台插件收进
          #     AppImage ⇒ 纯 Wayland 会话里 `Could not find the Qt platform plugin` 直接 abort
          #     （真机实测 rc=134）。装了之后 wayland 插件才会一起被打包。
          #   ★ `gdk-pixbuf2`（2026-11-06 补）：我们的 `provider_gdk` 用 `dlopen` 找
          #     `libgdk_pixbuf-2.0.so.0`，**容器里没装就整条 provider 静默消失** ——
          #     第一次跑本工作流时 `[cap]` 只有 `qt(21) + cli(0)`，"2 providers"，
          #     gdk 那 43 个后缀一个都没被覆盖，而构建照样全绿。下面那步断言把它变成红灯。
          #   `Qt6::GuiPrivate` 需要 Qt 的私有头（Arch 的 qt6-base 自带）
          echo "Qt $(qmake6 -query QT_VERSION)"

      - uses: actions/checkout@v7

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          #   ★ 不许静默降级：`-Step` 之外没有快路径，配置失败就是失败
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        #   ★ 两个环境变量由 `tests/CMakeLists.txt` 的 ENVIRONMENT 已经带上；
        #     这里再显式给一次，方便单看这一步的日志（无 display 时套件会 abort）。
        run: |
          ctest --test-dir build --output-on-failure \
            --test-output-size-passed 65536
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"

      - name: Capability report ([cap])
        #   ★ 这一步是这个项目在 Linux 上最重要的"体检"：
        #     打印**这台机器到底能解什么**（Qt 插件 / gdk-pixbuf / 外部程序各贡献了哪些后缀）。
        #     以后排查"某个格式为什么看不到"时，先看这里。
        #   ⚠️ 必须给 `QT_QPA_PLATFORM=offscreen`：容器里没有 display，
        #      不给的话进程**启动即 abort**（不是我们这个 bug，是 Qt 平台插件起不来），
        #      于是在 CI 里只会看到一行 "Aborted"、日志文件根本不生成。
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          mkdir -p /tmp/capsample
          #   ⚠️ 先清掉可能残留的实例（2026-11-06 起应用是**多实例**，不再有"第二次启动
          #      转发给旧进程然后退出"的旧行为；这里 pkill 只是为了日志干净、端口/socket 干净）。
          pkill -f photoset-reader 2>/dev/null || true
          timeout 10 ./build/photoset-reader /tmp/capsample \
            --log-level info --log-file /tmp/cap.log >/dev/null 2>&1 || true
          echo "──────── [cap] ────────"
          grep -E '\[cap\]' /tmp/cap.log || echo "(没有 cap 日志 —— 探测没跑到，是 bug)"
          #   ★ 断言而不是只看：能力**静默变少**是这个项目最难发现的退化
          #     （provider 靠 dlopen，缺个 .so 就整条消失，构建和测试全绿）。
          if ! grep -qE '\[cap\] gdk +: [1-9]' /tmp/cap.log; then
            echo "::error::gdk-pixbuf provider 没有生效：CI 的能力覆盖少了一大块（见上表的 gdk 行）"
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-cap-log
          path: /tmp/cap.log
          if-no-files-found: ignore
          retention-days: 7

      #   ── 构建产物（用户 2026-11-07：本地测试直接用 CI 版本）────────────────────
      #   只装成"安装布局"再打一个 tar.gz：`bin/photoset-reader` + `.desktop` + 图标 + 许可。
      #   ★ 不带依赖库：动态链接，目标机需要自己装 qt6 / libarchive / libexif / libunrar
      #     （`scripts/install-deps.sh` 覆盖 Arch / Debian / Fedora / openSUSE）。
      #     容器是 Arch，glibc 版本比 Debian 系新 —— 这份包按"Arch 系"用。
      - name: Package
        #   ⚠️ `--version` 也要 `QT_QPA_PLATFORM=offscreen`：GUI 程序在没有 display 的
        #      容器里启动 QGuiApplication 会直接 abort（exit 134，实测踩到）。
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --install build --prefix dist
          tar -czf photoset-reader-linux-x64.tar.gz -C dist .
          ls -l photoset-reader-linux-x64.tar.gz
          ./dist/bin/photoset-reader --version

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: photoset-reader-linux-x64
          path: photoset-reader-linux-x64.tar.gz
          retention-days: 14

  # ══ AppImage（便携版）：静态 Qt + 本地那套打包脚本 ══════════════════════════
  #   用户 2026-11-07：
  #     · 便携版就是 AppImage，**体积尽量小**；
  #     · 静态 Qt 单独一个仓库编（几十分钟、~19 GB），这里只**下载**它的 release 资产；
  #     · 打包走仓库里已有的 `scripts/package-appimage.sh`（AppRun 是 shell 脚本，
  #       不需要 qt.conf / 手抄 QML 模块 —— 静态 Qt 把 QML 插件也链进去了）。
  appimage:
    #   ★ 静态 Qt 的 release 资产由独立仓库产出，**没发布时这个 job 直接跳过**
    #     （用户 2026-11-07）：把仓库变量 `STATIC_QT_TAG` 设成 `qt-6.12.0` 才会真正跑，
    #     免得每次提交都因为资产还 404 而把整条工作流染红。
    #       gh variable set STATIC_QT_TAG --body qt-6.12.0 -R zhangmq/photoset-reader
    if: ${{ vars.STATIC_QT_TAG != '' }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          #   * python：package-appimage.sh 里算依赖闭包的那段是 python3 脚本。
          #   * qt6-tools 提供 lrelease6：静态 Qt 前缀里没有 LinguistTools（只编了 4 个模块），
          #     CMakeLists 会退回到系统的 lrelease 生成 .qm（第一次跑就栽在这）。
          #   !! 注释不能夹在 `\` 续行中间 —— shell 会把续行末尾的注释当成行尾，
          #      后面的参数就变成"命令找不到"（qt6-tools: command not found）。
          pacman -S --noconfirm --needed \
            git cmake ninja gcc pkgconf \
            python \
            qt6-tools \
            zlib xz libarchive libexif libunrar \
            libxcb xcb-util xcb-util-wm xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil xcb-util-cursor \
            libxkbcommon wayland wayland-protocols \
            fontconfig freetype2 harfbuzz dbus libglvnd mesa \
            squashfs-tools zstd

      - uses: actions/checkout@v7

      - name: Fetch static Qt (prebuilt, separate repo)
        run: |
          set -euo pipefail
          #   ★ 版本与资产名是**契约**：改 Qt 版本时两处一起改
          #     （这里 + https://github.com/zhangmq/photoset-reader-qt 的 release 标签）
          #   ★ 用仓库变量当"契约"：它既是开关，也是 release 标签
          TAG="${{ vars.STATIC_QT_TAG }}"
          NAME="${TAG}-static-linux-x86_64"
          BASE="https://github.com/zhangmq/photoset-reader-qt/releases/download/${TAG}"
          mkdir -p .tmp
          curl -fL --retry 3 -o "/tmp/${NAME}.tar.xz"      "${BASE}/${NAME}.tar.xz"
          curl -fL --retry 3 -o "/tmp/${NAME}.sha256"      "${BASE}/${NAME}.sha256"
          ( cd /tmp && sha256sum -c "${NAME}.sha256" )
          tar -xJf "/tmp/${NAME}.tar.xz" -C .tmp
          ls .tmp/qt-static/bin | head
          .tmp/qt-static/bin/qmake -query QT_VERSION || true

      - name: Build minimal libarchive
        #   * 用户 2026-11-07（体积）：AppImage 里 `usr/lib` 一度有 46 MB，其中
        #     `libicudata.so.78` 独占 32 MB + libcrypto 5.7 MB + libicuuc 2.1 MB + libxml2 1.3 MB
        #     —— 全是**系统 libarchive 的传递依赖**。这个脚本编的 libarchive 关了
        #     libxml2/expat/curl/openssl ⇒ 那 40 MB 直接消失（这正是它存在的理由）。
        run: |
          set -euo pipefail
          chmod +x scripts/build-minimal-deps.sh
          ./scripts/build-minimal-deps.sh .tmp/deps
          ls .tmp/deps/lib

      - name: Configure and build (static)
        env:
          #   让 CMake 优先用最小化的 libarchive（而不是系统那个带 ICU 的）
          PKG_CONFIG_PATH: ${{ github.workspace }}/.tmp/deps/lib/pkgconfig
        run: |
          set -euo pipefail
          cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/.tmp/qt-static" \
            -DCMAKE_CXX_FLAGS="-ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--gc-sections"
          cmake --build build-static --target photoset-reader --parallel "$(nproc)"
          ls -l build-static/photoset-reader
          size build-static/photoset-reader || true

      - name: Package AppImage
        run: |
          set -euo pipefail
          chmod +x scripts/package-appimage.sh
          ./scripts/package-appimage.sh --deps .tmp/deps
          ls -l dist/
          #   ★ 冒烟：跑一次（--version 在 engine.load 之前返回，但至少证明动态库闭包是完整的）
          #   冒烟必须**能失败**：静态 Qt 里若没导入平台插件、或依赖闭包缺库，--version 就会非 0
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --version
          #   * software scene graph path (2026-11-07): the correct switch is
          #     QT_QUICK_BACKEND=software (QSG_RHI_BACKEND=software is invalid and Qt
          #     silently falls back). Proves "no GPU still renders": the log must contain
          #     both the fallback line and a presenting viewer.
          mkdir -p /tmp/swsrc
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/*.AppImage /tmp/swsrc --log-level info --log-file /tmp/sw.log &
          SW_PID=$!
          for i in $(seq 1 20); do
            sleep 0.5
            grep -q '\[ui\] viewer' /tmp/sw.log && break
          done
          kill $SW_PID 2>/dev/null || true
          wait $SW_PID 2>/dev/null || true
          grep -q 'scene graph backend is software' /tmp/sw.log || {
            echo "::error::software scene graph path failed (no fallback line)"
            tail -20 /tmp/sw.log || true; exit 1; }
          grep -q '\[ui\] viewer' /tmp/sw.log || {
            echo "::error::software scene graph path produced no frames"
            tail -20 /tmp/sw.log || true; exit 1; }
          echo "  software backend smoke: OK"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: photoset-reader-linux-appimage
          path: dist/*.AppImage
          retention-days: 14
          if-no-files-found: error
