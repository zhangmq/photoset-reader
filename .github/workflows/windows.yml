name: windows

#   ★ 目的：在 GitHub 托管的 Windows runner 上**真的用 MSVC 编一遍**，
#     让 Windows 移植的编译期问题（头文件 / 库名 / CMake 胶水）早暴露，
#     顺带产出可下载的 exe + DLL 闭包。真机画质仍需在 Windows 上目检（runner 没有 GPU）。
#
#   依赖来源：
#     · Qt 6.12 —— aqtinstall（公开镜像，不需要 Qt 账号）
#     · libarchive / libexif / libheif / liblzma / zlib —— vcpkg（runner 预装）
#     · libunrar —— 上游源码 + 自带 UnRARDll.vcxproj（vcpkg 没有这个 port）

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSES/**"
  workflow_dispatch:

env:
  QT_VERSION: "6.12.0"
  QT_ARCH: "win64_msvc2022_64"
  UNRAR_VERSION: "7.1.6"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      #   MSVC 只在 Windows runner 上有：这一步把 cl / link / msbuild 放进 PATH。
      #   ★ 不锁 VS 版本（runner 镜像会换，锁了反而找不到）；unrar 那一步也**不用 msbuild**，
      #     所以工具集编号不需要猜。
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Qt（缓存命中就跳过下载；装出来约 1.5 GB）──────────────────────────
      #   ★ 用 restore / save 两步而不是 `actions/cache`：普通 cache 的保存挂在
      #     post 步骤上，**job 一失败就跳过**（实测 Post Cache Qt: skipped），
      #     于是每挂一次就白等 30 分钟重下 Qt + 重编 vcpkg。
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt
          key: qt-6.12.0-msvc2022_64-v1
          restore-keys: qt-6.12.0-

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-matched-key == ''
        shell: pwsh
        run: |
          #   ★ 不用 aqtinstall：它 3.3.0 还不认 Qt 6.12 的仓库布局
          #     （找 `qt6_6120/qt6_6120/Updates.xml`，而 6.12 只有各架构子目录）。
          #     这里直接按仓库的 Updates.xml 取 7z，文件名 = <包内 Version> + <DownloadableArchives>。
          $repo   = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64"
          $prefix = "C:\Qt\6.12.0\msvc2022_64"
          $pkgs = @(
            "qt.qt6.6120.win64_msvc2022_64"
            "qt.qt6.6120.addons.qtshadertools.win64_msvc2022_64"
            "qt.qt6.6120.addons.qtimageformats.win64_msvc2022_64"
          )
          #   qtdoc / qttranslations 用不上（体积大、装完也用不到）
          $skip = "qtdoc|qttranslations"
          [xml]$xml = (Invoke-WebRequest "$repo/Updates.xml").Content
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          foreach ($p in $xml.SelectNodes("//PackageUpdate")) {
            if ($pkgs -notcontains $p.Name) { continue }
            $archives = ($p.DownloadableArchives -split ',') |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and $_ -notmatch $skip }
            foreach ($a in $archives) {
              $url = "$repo/$($p.Name)/$($p.Version)$a"
              Write-Host "== $a"
              Invoke-WebRequest $url -OutFile $a
              & 7z x -y "-o$prefix" $a | Out-Null
            }
          }
          Get-ChildItem $prefix | Select-Object Name

      #   ★ 显式保存（`always()`）：后面任何一步失败，Qt 也不用重下
      - name: Save Qt
        if: always() && steps.qt-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: C:\Qt
          key: qt-6.12.0-msvc2022_64-v1

      - name: Put Qt on PATH
        shell: pwsh
        run: '"C:\Qt\6.12.0\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'

      # ── 第三方库（vcpkg）──────────────────────────────────────────────────
      #   ★ 显式关掉不要的 feature，两个理由：
      #     · `libheif` 默认 `hevc,libde265` ⇒ 会带 HEVC 解码器，**不许分发**（见设计 21 §8）；
      #       AVIF 用 `dav1d`（AV1 免专利）。
      #     · `libarchive` 默认 `crypto`（Windows 上是 openssl）与 `xar` ⇒ 我们不用，
      #       只会给包体加一堆 DLL。
      - name: Restore vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-v3

      - name: vcpkg install dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install `
            "libarchive[core,bzip2,lz4,lzma,zstd]" `
            "libheif[core,dav1d]" `
            libexif liblzma zlib `
            --triplet x64-windows --recurse
          #   ★ 万一树里还留着 HEVC（旧缓存 / 别的包带进来的），装完直接卸掉
          & $vcpkg remove libde265 libx265 2>$null
          $heif = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\heif.dll"
          if (Test-Path $heif) {
            Write-Host "== heif.dll 依赖 =="
            & dumpbin /nologo /dependents $heif | Select-String '\.dll'
          }

      - name: Save vcpkg
        if: always() && steps.vcpkg-cache.outputs.cache-matched-key != 'vcpkg-x64-windows-v3'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-v3

      # ── libunrar：上游源码 + 它自己的 vcxproj（工具集覆盖成 v143）─────────
      - name: Build libunrar
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.rarlab.com/rar/unrarsrc-$env:UNRAR_VERSION.tar.gz" -OutFile unrar.tar.gz
          tar -xzf unrar.tar.gz
          Push-Location unrar
          #   ★★ 关掉 unrar 的 SMP（线程池）：7.1.6 在 DLL 模式 + 本工程"逐条读、随时关包"的
          #     用法下，`RARCloseArchive` 会死等线程池里的工作线程 —— 2026-11-05 真机实测：
          #     打开加密 solid 包、解到第 ~43 条时整个窗口卡死（线程栈停在
          #     RARCloseArchive → WaitForSingleObject）。单线程解压只是慢一点，但不会卡死。
          #     `os.hpp` 里 `#if !defined(ZIPSFX)` 那段就是 `#define RAR_SMP`，屏蔽掉即可。
          $osHpp = 'os.hpp'
          $osText = [IO.File]::ReadAllText($osHpp)
          $patched = $osText -replace '#if !defined\(ZIPSFX\)\s*\r?\n#define RAR_SMP\s*\r?\n#endif',
            "// [photoset] RAR_SMP disabled (dll-mode deadlock)`r`n#if 0`r`n#define RAR_SMP`r`n#endif"
          if ($patched -eq $osText) { throw "unrar: RAR_SMP 补丁没匹配上（源码版本变了？）" }
          [IO.File]::WriteAllText($osHpp, $patched, (New-Object System.Text.UTF8Encoding($false)))
          #   ★ 不用 msbuild：vcxproj 钉死 Windows SDK 8.1 + 工具集 v140_xp，
          #     runner 上两样都没有，而工具集编号又随镜像变。
          #     源文件清单从 vcxproj 里取（<ClCompile Include>），宏照它的 5 个设置。
          #   ★ `/utf-8`：源码里有非 ASCII 注释；没有它，非英文 locale 下注释会吞掉后面的代码。
          [xml]$proj = Get-Content UnRARDll.vcxproj
          $srcs = @($proj.SelectNodes("//*[local-name()='ClCompile']") |
                    ForEach-Object { $_.GetAttribute('Include') } | Where-Object { $_ })
          Write-Host "libunrar: $($srcs.Count) 个源文件"
          cl /nologo /utf-8 /MP /O2 /EHsc /MT /DRARDLL /DUNRAR /DSILENT $srcs `
            /link /DLL /DEF:dll.def /OUT:unrar.dll /IMPLIB:unrar.lib `
            kernel32.lib user32.lib advapi32.lib shell32.lib ole32.lib oleaut32.lib uuid.lib
          if ($LASTEXITCODE -ne 0) { throw "libunrar: 编译失败" }
          Pop-Location
          New-Item -ItemType Directory -Force -Path unrar-prefix\lib, unrar-prefix\include\unrar | Out-Null
          Copy-Item unrar\unrar.lib unrar-prefix\lib\unrar.lib
          Copy-Item unrar\unrar.dll unrar-prefix\lib\unrar.dll
          Copy-Item unrar\dll.hpp unrar-prefix\include\unrar\dll.hpp
          Get-ChildItem -Recurse unrar-prefix | Select-Object FullName

      # ── 配置 + 构建 ───────────────────────────────────────────────────────
      - name: Configure and build
        shell: pwsh
        run: |
          $unrar = Join-Path $env:GITHUB_WORKSPACE "unrar-prefix"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="C:\Qt\$env:QT_VERSION\msvc2022_64" `
            -DUNRAR_LIBRARY="$unrar\lib\unrar.lib" `
            -DUNRAR_INCLUDE_DIR="$unrar\include"
          cmake --build build --parallel

      # ── HLSL 编译检查（**只在 Windows 才会暴露**的一类坑）─────────────────
      #   qsb 把 GLSL 烘成 HLSL 文本，真正编译它的是运行期的 D3D 编译器。
      #   2026-11-05 真机踩到：循环里用了隐式求导的 `texture()` ⇒ HLSL 报
      #   "X3511: unable to unroll loop" ⇒ 管线创建失败、D3D 设备丢失。
      #   这里在 CI 里用 fxc 提前编译一遍，别再等到真机。
      - name: HLSL compile check
        shell: pwsh
        run: |
          $qsb = "C:\Qt\$env:QT_VERSION\msvc2022_64\bin\qsb.exe"
          $fxc = (Get-Command fxc -ErrorAction SilentlyContinue).Source
          if (-not $fxc) {
            $fxc = Get-ChildItem "$env:WindowsSdkVerBinPath\x64\fxc.exe" -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $fxc) { throw "找不到 fxc.exe（Windows SDK 里）" }
          $failed = @()
          foreach ($s in Get-ChildItem src\shaders\*.frag) {
            $tmp = "$($s.BaseName).qsb"
            & $qsb --hlsl 50 -o $tmp $s.FullName
            if ($LASTEXITCODE -ne 0) { $failed += "$($s.Name)(qsb)"; continue }
            #   从 --dump 里抠出 HLSL 源：取 "Shader N: HLSL" 之后那个 Contents: 到 *** 分隔符
            $lines = & $qsb --dump $tmp
            $hlsl = @(); $inHlsl = $false; $capture = $false
            foreach ($l in $lines) {
              if ($l -match '^Shader \d+: HLSL') { $inHlsl = $true; continue }
              if ($inHlsl -and $l -match '^Contents:$') { $capture = $true; continue }
              if ($capture -and $l -match '^\*{10,}$') { break }
              if ($capture) { $hlsl += $l }
            }
            if ($hlsl.Count -eq 0) { $failed += "$($s.Name)(dump)"; continue }
            $f = "$($s.BaseName).hlsl"
            Set-Content -Path $f -Value $hlsl -Encoding utf8
            & $fxc /nologo /T ps_5_0 /E main /Fo "$($s.BaseName).cso" $f
            if ($LASTEXITCODE -ne 0) { $failed += $s.Name }
          }
          if ($failed.Count -gt 0) { throw "HLSL 编译失败：$($failed -join ', ')" }
          Write-Host "HLSL 全部通过"

      # ── 测一遍 + 冒烟 ─────────────────────────────────────────────────────
      #   ★ 不走 ctest：它在超时后只报 "Timeout"，看不到测试自己打到哪一步。
      #     这里逐个跑、逐个超时、把最后 30 行输出打出来。
      #   ★ offscreen：runner 没有真实桌面会话。
      - name: Test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          #   ★ Qt 日志默认被吞（Windows 上走 OutputDebugString）—— 不加这个，测试
          #     失败时一行输出都看不到（AGENTS.md「坑」第 1 条）。
          $env:QT_FORCE_STDERR_LOGGING = "1"
          #   控制台按 UTF-8，否则中文输出全是问号
          chcp 65001 | Out-Null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          #   ★ 测试可执行也要能找到第三方 DLL（vcpkg 的 bin 不在 PATH 上）
          #     否则进程起不来：exit code -1073741515 = 0xC0000135 STATUS_DLL_NOT_FOUND
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:GITHUB_WORKSPACE\unrar-prefix\lib;C:\Qt\$env:QT_VERSION\msvc2022_64\bin;$env:PATH"
          $failed = @()
          #   ★ 四个套件都要跑：`ib-test-viewer` 是最大的那套（悬停预览 / 幻灯片 / 设置，
          #     41 项），以前漏在这里 ⇒ CI 绿了但那段逻辑没验过（2026-11-06 补上）。
          foreach ($t in "ib-test-scan", "ib-test-progress", "ib-test-meta", "ib-test-viewer") {
            Write-Host "== $t =="
            $p = Start-Process -FilePath ".\build\$t.exe" -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$t.out" -RedirectStandardError "$t.err"
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              Write-Host "TIMEOUT after 120s"
              $failed += $t
            } elseif ($p.ExitCode -ne 0 -and $p.ExitCode -ne 77) {
              Write-Host "exit code $($p.ExitCode)"
              $failed += $t
            }
            #   测试输出很短，全打出来（只打尾部会把失败的条目漏掉）
            Get-Content "$t.out" -ErrorAction SilentlyContinue
            Get-Content "$t.err" -ErrorAction SilentlyContinue
          }
          Write-Host "== smoke: --version =="
          $p = Start-Process -FilePath ".\build\photoset-reader.exe" -ArgumentList "--version" `
               -PassThru -NoNewWindow -RedirectStandardOutput "ver.out" -RedirectStandardError "ver.err"
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            Write-Warning "version smoke 超时（GUI 初始化卡住）"
          } else {
            Get-Content ver.out -ErrorAction SilentlyContinue
          }
          if ($failed.Count -gt 0) { throw "测试未通过：$($failed -join ', ')" }

      # ── 打包：windeployqt 收 Qt，再按 **PE 依赖闭包** 拷第三方 DLL ──────────
      #   ★ 不整拷 `vcpkg\installed\...\bin\*.dll`：那会把 openssl / curl / de265 /
      #     x265 之类我们根本不依赖（或明确禁止分发）的 DLL 一起塞进来。
      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\photoset-reader.exe $stage
          & "C:\Qt\$env:QT_VERSION\msvc2022_64\bin\windeployqt.exe" `
            --release --no-opengl-sw --no-translations --qmldir src\ui "$stage\photoset-reader.exe"

          #   ── 依赖闭包：从 exe 与 Qt 的 DLL 出发，递归补齐 ──
          $search = @(
            (Resolve-Path $stage).Path
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
            "$env:GITHUB_WORKSPACE\unrar-prefix\lib"
            "C:\Qt\$env:QT_VERSION\msvc2022_64\bin"
          )
          $system32 = "$env:SystemRoot\System32"
          $queue = [System.Collections.Generic.Queue[string]]::new()
          Get-ChildItem $stage -Recurse -Include *.exe, *.dll | ForEach-Object { $queue.Enqueue($_.FullName) }
          $seen = @{}
          $added = @()
          $missing = @()
          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            if ($seen.ContainsKey($file)) { continue }
            $seen[$file] = $true
            $deps = (& dumpbin /nologo /dependents $file 2>$null) |
                    Select-String '^\s+(\S+\.dll)\s*$' |
                    ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($d in $deps) {
              if ($d -match '^(api-ms-|ext-ms-)') { continue }
              $src = $null
              foreach ($dir in $search) {
                $cand = Join-Path $dir $d
                if (Test-Path $cand) { $src = $cand; break }
              }
              if (-not $src) {
                if (-not (Test-Path (Join-Path $system32 $d))) { $missing += "$d ($([IO.Path]::GetFileName($file)))" }
                continue
              }
              $dst = Join-Path $stage $d
              if (-not (Test-Path $dst)) { Copy-Item $src $dst; $added += $d }
              $queue.Enqueue($dst)
            }
          }
          Write-Host "补齐的 DLL：$($added -join ', ')"
          if ($missing.Count -gt 0) { throw "缺依赖：$($missing -join '; ')" }

          #   ── 红线：禁止分发 HEVC 解码/编码器（设计 21 §8）──
          foreach ($bad in "libde265.dll", "libx265.dll", "libheif-hevc.dll") {
            if (Test-Path (Join-Path $stage $bad)) { throw "禁止分发 HEVC 组件：$bad" }
          }
          if (Test-Path "unrar-prefix\lib\unrar.dll") { Copy-Item unrar-prefix\lib\unrar.dll $stage -Force }

          #   ── ICU：Qt6Core.dll 硬导入 `icuuc.dll`（Qt 6.12 起），windeployqt 不拷 ──
          #   ★ 但 Qt 6.12 的 Windows 包**不自带** ICU：它用系统 ICU
          #     （`%SystemRoot%\System32\icuuc.dll`，Win10 1703+ 自带，导出转发到 `icu.dll`）。
          #     所以：Qt 目录里有就拷（将来版本若自带），否则确认系统有；都没有说明目标系统太旧。
          $qtRoot = "C:\Qt\$env:QT_VERSION\msvc2022_64"
          $icu = Get-ChildItem $qtRoot -Recurse -Include icu*.dll, icu*.dat -ErrorAction SilentlyContinue
          if ($icu) {
            Copy-Item $icu.FullName $stage -Force
            Write-Host "ICU（来自 Qt）：$(($icu.Name | Sort-Object -Unique) -join ', ')"
          } elseif (Test-Path "$env:SystemRoot\System32\icuuc.dll") {
            Write-Host "ICU：使用系统自带的 $env:SystemRoot\System32\icuuc.dll（Win10 1703+）"
          } else {
            throw "ICU 缺失：Qt 未自带，系统也没有 icuuc.dll（目标系统过旧？）"
          }

          #   ── VC++ 运行时：windeployqt **不拷**，但目标机没装可再发行包就起不来 ──
          $crt = Get-ChildItem -Path "$env:VCToolsRedistDir\x64" -Filter "Microsoft.VC*.CRT" -Directory |
                 Select-Object -First 1
          if ($crt) {
            Copy-Item "$($crt.FullName)\*.dll" $stage
            Write-Host "VC 运行时来自：$($crt.FullName)"
          } else {
            Write-Warning "找不到 VC 运行时目录（VCToolsRedistDir=$env:VCToolsRedistDir）"
          }

          #   ── 冒烟：**用打包好的目录**跑一次，缺 DLL / 缺平台插件会立刻露出来 ──
          #   ★ 必须先把 `qoffscreen.dll` 放进 stage：windeployqt 只部署 `qwindows.dll`，
          #     指定 offscreen 却没有插件时，Qt 会弹**模态错误框**把进程挂住（实测超时）。
          $off = "C:\Qt\$env:QT_VERSION\msvc2022_64\plugins\platforms\qoffscreen.dll"
          if (Test-Path $off) { Copy-Item $off "$stage\platforms\" -Force; $env:QT_QPA_PLATFORM = "offscreen" }
          $p = Start-Process -FilePath "$stage\photoset-reader.exe" -ArgumentList "--version" `
               -PassThru -NoNewWindow -RedirectStandardOutput "stage-ver.out" -RedirectStandardError "stage-ver.err"
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "打包后冒烟超时" }
          Get-Content stage-ver.out -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-Content stage-ver.err -ErrorAction SilentlyContinue
            throw "打包后冒烟失败：exit $($p.ExitCode)"
          }
          Copy-Item LICENSE, THIRD-PARTY.md, THIRD-PARTY.en.md, LICENSES\*.txt $stage
          Get-ChildItem $stage -Filter *.dll | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("DLL 共 {0} 个 / {1:N1} MB" -f $_.Count, ($_.Sum / 1MB)) }

      # ── 冒烟②：**打包目录里真把界面跑起来**（`--version` 不会加载 QML）────────
      #   ★ 为什么必须有这一步：2026-11-06 真机踩到 `import QtQuick.Effects`（无版本）在
      #     AOT 编译的模块里**运行期**报 "RectangularShadow is not a type"，QML 加载直接失败；
      #     而 `--version` 根本走不到 QML ⇒ 那种包能通过上一版冒烟、下载下来却起不来。
      #   ★ 用 offscreen 平台 + 现造 3 张小 PNG 当来源：能覆盖 QML 加载 / 扫描 / 解码，
      #     并且只看两件确定的事：日志里没有 QML 加载失败、出现过解码统计行。
      #     （runner 没有 GPU；渲染是否成功不在这一步的断言范围内。）
      - name: Smoke (packaged UI)
        shell: pwsh
        run: |
          $stage = "stage"
          $off = "C:\Qt\$env:QT_VERSION\msvc2022_64\plugins\platforms\qoffscreen.dll"
          if ((Test-Path $off) -and -not (Test-Path "$stage\platforms\qoffscreen.dll")) {
            Copy-Item $off "$stage\platforms\" -Force
          }
          $env:QT_QPA_PLATFORM = "offscreen"

          #   造 3 张 1×1 的 PNG 当来源：**直接写字节**（不依赖 System.Drawing —— runner 上的
          #   pwsh 是 .NET 7，`Add-Type -AssemblyName System.Drawing` 不保证可用）。
          $dir = "smoke-pages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $png = [Convert]::FromBase64String(
            "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==")
          for ($i = 0; $i -lt 3; $i++) {
            [IO.File]::WriteAllBytes((Join-Path $dir "p$i.png"), $png)
          }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize

          $log = "smoke-ui.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$stage\photoset-reader.exe" `
               -ArgumentList "`"$((Resolve-Path $dir).Path)`"", "--log-level", "debug", "--log-file", $log `
               -PassThru
          $ready = $false
          $deadline = (Get-Date).AddSeconds(40)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $log) {
              if (Select-String -Path $log -Pattern "1s ready=" -Quiet -ErrorAction SilentlyContinue) {
                $ready = $true
                break
              }
            }
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content $log -ErrorAction SilentlyContinue
          $bad = Select-String -Path $log -Pattern "QML load failed|is not a type|is not installed|Type .* unavailable" -ErrorAction SilentlyContinue
          if ($bad) { throw "打包产物 QML 加载失败：$($bad[0].Line)" }
          if (-not $ready) { throw "打包产物没跑起来：40 s 内没有解码日志（1s ready=…）" }
          Write-Host "打包产物冒烟通过（界面已加载、已开始解码）"

      #   ★★ 不要再 `Compress-Archive` 一层：`upload-artifact` 自己就会把内容打成 zip，
      #      再压缩一层的话下载下来是「zip 里套 zip」（用户 2026-11-05 指出）。
      #      这里直接上传 stage 的内容 ⇒ 下载得到一个 zip，解开就是 exe + DLL。
      #      需要发布单文件 zip 时，在 release 那步再压（本地 `scripts/ci-windows.ps1 -Step package`
      #      产出的 `dist/photoset-reader-windows-x64.zip` 就是那个形态）。
      - uses: actions/upload-artifact@v4
        with:
          name: photoset-reader-windows-x64
          path: stage/**
          retention-days: 30
